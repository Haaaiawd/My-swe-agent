task_description: |
  Read requirements.md first to understand the task, then create demo.html.

  You must output exactly ONE bash command per step wrapped in:
  ```mswea_bash_command
  <command here>
  ```

  When complete, submit with:
  COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT

model:
  name: "openrouter/inclusionai/ring-2.6-1t:free"
  protocol: "text"
  api_key: "${MINI_SWE_MODEL__API_KEY}"
  stream: true
  extra_params:
    api_base: "https://openrouter.ai/api/v1"

agent:
  step_limit: 10
  cost_limit: 0.1
  confirm_mode: false

output:
  trajectory_path: "./outputs/trajectory.json"
